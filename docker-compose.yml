services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: raffle_db
      TZ: Europe/Moscow
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    # Порт наружу не публикуем: на прод-сервере 3306 занят нативным MySQL.
    # Локально для доступа из IDE создайте docker-compose.override.yml вида:
    #   services:
    #     mysql:
    #       ports: ["127.0.0.1:3307:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:alpine
    # Аналогично redis: публикацию 6379 не публикуем.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  bot:
    build: .
    environment:
      # Важно: внутри Docker сеть своя, поэтому localhost меняется на имена сервисов (mysql и redis)
      BOT_TOKEN: ${BOT_TOKEN}
      DATABASE_URL: mysql+aiomysql://root:password@mysql:3306/raffle_db
      REDIS_URL: redis://redis:6379/0
      ADMIN_IDS: ${ADMIN_IDS}
      TZ: Europe/Moscow
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
