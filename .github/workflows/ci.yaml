name: CI

# Минимальная проверка: линтер ruff + проверка форматирования + компиляция.
# Тесты в tests/ — интеграционные (нужны реальные MySQL и ADMIN_IDS),
# поэтому в CI не гоняются.
on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  quick-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Compile check
        run: python -m compileall bot main.py migrations
